services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: onlinebookstore
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookstore-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bookstore-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup/mysql-init.sql:/docker-entrypoint-initdb.d/01-mysql-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    image: onlinebookstore:${IMAGE_TAG:-local}
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: jdbc:mysql://db
      DB_PORT: "3306"
      DB_NAME: onlinebookstore
      DB_USERNAME: bookstore
      DB_PASSWORD: ${MYSQL_PASSWORD:-bookstore-dev-password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
